<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        // Suppress external extension errors from breaking the page
        window.addEventListener('error', function(e) {
          if (e && e.filename && e.filename.indexOf('chrome-extension://') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);

        // Define getter/setter for window.fetch so browser extensions can intercept without throwing TypeError
        try {
          var _origFetch = window.fetch;
          var _currentFetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(val) {
              _currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          // ignore
        }
      })();
    </script>
